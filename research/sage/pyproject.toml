[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshmind-sage-research"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
description = "Contained, experimental DTN relay-value research for MeshMind"

[tool.setuptools.packages.find]
include = ["sage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
